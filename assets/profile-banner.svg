<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NixWrk</title>
  <desc id="desc">Document lines are read, carried into two notes, and connected into a shared knowledge node. The wordmark stays still; the sequence plays once, then rests.</desc>
  <style>
    .trace, .signal, .connection { opacity: 0; }
    .trace {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: read-line 4.8s cubic-bezier(.16, 1, .3, 1) both;
    }
    .trace-middle { animation-delay: .12s; }
    .trace-bottom { animation-delay: .24s; }
    .signal-top { animation: carry-top 4.8s cubic-bezier(.16, 1, .3, 1) both; }
    .signal-bottom { animation: carry-bottom 4.8s cubic-bezier(.16, 1, .3, 1) both; }
    .connection {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: connect-notes 4.8s cubic-bezier(.16, 1, .3, 1) both;
    }
    .note-top { animation: receive-top 4.8s ease-out both; }
    .note-bottom { animation: receive-bottom 4.8s ease-out both; }
    .result { animation: resolve 4.8s ease-out both; }

    @keyframes read-line {
      0%, 5% { opacity: 0; stroke-dashoffset: 1; }
      10% { opacity: 1; stroke-dashoffset: 1; }
      25%, 30% { opacity: 1; stroke-dashoffset: 0; }
      40%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes carry-top {
      0%, 30% { opacity: 0; transform: translate(0, 0); }
      34% { opacity: 1; transform: translate(0, 0); }
      47% { opacity: 1; transform: translate(127px, -34px); }
      51%, 100% { opacity: 0; transform: translate(127px, -34px); }
    }
    @keyframes carry-bottom {
      0%, 35% { opacity: 0; transform: translate(0, 0); }
      39% { opacity: 1; transform: translate(0, 0); }
      52% { opacity: 1; transform: translate(127px, 34px); }
      56%, 100% { opacity: 0; transform: translate(127px, 34px); }
    }
    @keyframes receive-top {
      0%, 43% { fill: #75D4C5; }
      49%, 57% { fill: #EAF3F1; }
      68%, 100% { fill: #75D4C5; }
    }
    @keyframes receive-bottom {
      0%, 48% { fill: #75D4C5; }
      54%, 62% { fill: #EAF3F1; }
      73%, 100% { fill: #75D4C5; }
    }
    @keyframes connect-notes {
      0%, 52% { opacity: 0; stroke-dashoffset: 1; }
      56% { opacity: 1; stroke-dashoffset: 1; }
      70%, 78% { opacity: 1; stroke-dashoffset: 0; }
      90%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @keyframes resolve {
      0%, 66% { fill: #EAF3F1; }
      74%, 82% { fill: #75D4C5; }
      96%, 100% { fill: #EAF3F1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none; }
    }
  </style>

  <rect width="1200" height="220" rx="14" fill="#102D35"/>
  <text x="58" y="147" fill="#EAF3F1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="650" letter-spacing="-3">NixWrk</text>

  <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#75D4C5">
      <path d="M790 72H850M790 110H850M790 148H824"/>
      <path d="M892 110H937M923 96L937 110L923 124"/>
    </g>
    <g stroke="#EAF3F1">
      <path class="motion trace" d="M790 72H850" pathLength="1"/>
      <path class="motion trace trace-middle" d="M790 110H850" pathLength="1"/>
      <path class="motion trace trace-bottom" d="M790 148H824" pathLength="1"/>
    </g>
    <path d="M998 76L1096 110L998 144" stroke="#436F75"/>
    <path class="motion connection" d="M998 76L1096 110" stroke="#75D4C5" pathLength="1"/>
    <path class="motion connection" d="M998 144L1096 110" stroke="#75D4C5" pathLength="1"/>
  </g>

  <circle class="motion signal signal-top" cx="866" cy="110" r="4" fill="#EAF3F1"/>
  <circle class="motion signal signal-bottom" cx="866" cy="110" r="4" fill="#75D4C5"/>
  <rect class="motion note-top" x="971" y="58" width="44" height="36" rx="5" fill="#75D4C5"/>
  <rect class="motion note-bottom" x="971" y="126" width="44" height="36" rx="5" fill="#75D4C5"/>
  <rect class="motion result" x="1074" y="92" width="44" height="36" rx="5" fill="#EAF3F1"/>
</svg>
